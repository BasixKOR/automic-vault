name:
  isotope:bash

modifies:
  brew:bash

justification:
  title:
    Plain Text Bash Startup Credentials
  detail: |
    Bash startup files can export API keys, tokens, passwords, and other
    credential-shaped variables into every interactive or scripted shell.

    Automic Vault detects plaintext-looking secret assignments in common Bash
    startup files. Store those values in the Automic Vault keychain and inject
    them only into the command or script that needs them.

caveats:
  - This radioisotope is detect-only.
  - We inspect ~/.bashrc, ~/.bash_profile, ~/.bash_login, ~/.profile, and BASH_ENV.
  - Dynamic lookups such as command substitutions are not reported as plaintext.
  - Shell startup files outside those locations are not scanned unless passed to av scan.
