name:
  isotope:zsh

modifies:
  brew:zsh

justification:
  title:
    Plain Text Zsh Startup Credentials
  detail: |
    Zsh startup files can export API keys, tokens, passwords, and other
    credential-shaped variables into every interactive or login shell.

    Automic Vault detects plaintext-looking secret assignments in common Zsh
    startup files. Store those values in the Automic Vault keychain and inject
    them only into the command or script that needs them.

caveats:
  - This radioisotope is detect-only.
  - We inspect .zshenv, .zprofile, .zshrc, .zlogin, and .zlogout under ZDOTDIR or HOME.
  - Dynamic lookups such as command substitutions are not reported as plaintext.
  - Shell startup files outside those locations are not scanned unless passed to av scan.
