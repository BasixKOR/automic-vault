name: Rust Coverage

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  coveralls:
    name: Coveralls
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout isotope repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf data/isotopes data/radioisotopes
          mkdir -p data/isotopes

          gh repo list automic-vault --limit 200 --json name,isArchived,isFork \
            --jq '.[] | select(.isFork and (.isArchived | not)) | .name' |
            while IFS= read -r repo; do
              if gh api "repos/automic-vault/${repo}/contents/automic-vault.yml" >/dev/null 2>&1; then
                git clone --depth 1 "https://github.com/automic-vault/${repo}.git" "data/isotopes/${repo}"
              fi
            done

          git clone --depth 1 https://github.com/automic-vault/radioisotopes.git data/radioisotopes

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Verify coverage fixtures
        run: |
          /usr/bin/python3 scripts/generate-coverage-fixtures.py
          git diff --exit-code -- \
            data/combined.json \
            src/lib/rs/fixtures/coverage-combined.json

      - name: Generate Rust coverage
        run: >
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          -- --test-threads=1

      - name: Upload Rust coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          format: lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
